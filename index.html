<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope - Movie Discovery</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <nav>

        <div class="logo">
            CineScope
        </div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#movies">Movies</a></li>
            <li><a href="#genres">Genres</a></li>
            <li><a href="#watchlist">Watchlist</a></li>
        </ul>

    </nav>

    <section class="hero" id="home">

        <div class="hero-content">

            <span class="tag">MOVIE DISCOVERY</span>

            <h1>
                Discover Your<br>
                Next<br>
                <span class="highlight">Favorite Movie</span>
            </h1>

            <p class="description">
                Search thousands of movies, explore popular titles,
                discover new releases and create your own watchlist.
            </p>

            <a href="#movies" class="explore-btn">
                Explore Movies
            </a>

        </div>

    </section>

    <section class="discover" id="movies">

        <h1>Discover Movies</h1>

        <div class="search-area">
            <input type="text" aria-label="Search movies" placeholder="Search movies...">
            <button>Search</button>
        </div>

        <div class="filters">
            <button class="filter active">Popular</button>
            <button class="filter">Now Playing</button>
            <button class="filter">Top Rated</button>
            <button class="filter">Upcoming</button>
        </div>

    </section>

    <section class="section genres" id="genres">

        <h2>Genres</h2>

        <div id="genreGrid"></div>

    </section>

    <section class="section watchlist" id="watchlist">

        <h2>My Watchlist</h2>

        <p class="empty-message">
            Your watchlist is empty
        </p>

        <div id="watchlistGrid"></div>

    </section>

    <script src="index.js"></script>

</body>

</html>
