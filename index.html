<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <title>CineScope - Movie Search</title>

    <link rel="stylesheet" href="index.css">


</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">

            <a class="navbar-brand fw-bold text-danger" href="#">
                CineScope
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#home">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#movies">
                            Movies
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#genres">
                            Genres
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#watchlist">
                            Watchlist
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <section class="hero" id="home">

        <div class="hero-content">

            <span class="tag">MOVIE DISCOVERY</span>

            <h1>
                Discover Your<br>
                Next<br>
                <span class="highlight">Favorite Movie</span>
            </h1>

            <p class="description">
                Search thousands of movies, explore popular titles,
                discover new releases and create your own watchlist.
            </p>

            <a href="#movies" class="explore-btn">
                Explore Movies
            </a>

        </div>

    </section>


    <section class="discover" id="movies">

        <h1>Discover Movies</h1>

        <div class="search-area">

            <input type="text" id="search" aria-label="Search movies" placeholder="Search movies...">

            <button onclick="searchMovie()">
                Search
            </button>

        </div>

        <p id="message"></p>

        <div class="filters">

            <button class="filter active">
                Popular
            </button>

            <button class="filter">
                Now Playing
            </button>

            <button class="filter">
                Top Rated
            </button>

            <button class="filter">
                Upcoming
            </button>

        </div>

        <div id="movieContainer" class="movies"></div>

    </section>


    <section class="section genres" id="genres">

        <h2>Genres</h2>

        <div id="genreGrid"></div>

    </section>


    <section class="section watchlist" id="watchlist">

        <h2>My Watchlist</h2>
        <div id="watchlistGrid"></div>

    </section>
    <div class="modal fade" id="movieModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 720px;">
            <div class="modal-content bg-dark text-white">

                <div class="modal-body p-3">
                    <div class="row g-3">

                        <div class="col-4">
                            <img src="" alt="Movie Poster" id="moviePoster" class="img-fluid rounded">
                        </div>

                        <div class="col-8">
                            <h2 class="fs-3 mb-2" id="movieTitle"></h2>

                            <p class="text-warning mb-3" id="movieRating"></p>

                            <p class="mb-2">
                                <span class="text-secondary">Release Date:</span>
                                <span id="movieReleaseDate"></span>
                            </p>

                            <p class="mb-2">
                                <span class="text-secondary">Language:</span>
                                <span id="movieLanguage"></span>
                            </p>

                            <div class="bg-secondary bg-opacity-25 rounded p-2 mt-3">
                                <p class="text-secondary mb-0" id="movieOverview"></p>
                            </div>

                            <button class="btn btn-danger btn-sm mt-3" onclick="addToWatchlist(selectedMovie)" id="addToWatchlist">
                                Add to Watchlist
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/379f6932b1.js" crossorigin="anonymous"></script>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
